[project]
name = "codeflow-backend"
version = "0.2.0"
description = "CodeFlow API: auth, projects and code-execution job management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.7",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers (`from tests.conftest import ...`) under plain `pytest` too.
pythonpath = ["."]
